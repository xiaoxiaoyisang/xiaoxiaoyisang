  <link rel="stylesheet" href="css/common.css">

  <style>
    .calorie-ring {
      position: relative;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: conic-gradient(
        #FF8C42 0deg 0deg,
        #F0E8E0 0deg 360deg
      );
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 1s ease-out;
    }
    .calorie-ring::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2.5px solid rgba(61, 44, 34, 0.06);
      transform: rotate(-1deg);
    }
    .calorie-ring::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 48%;
      border: 2px dashed rgba(255, 140, 66, 0.15);
    }
    .calorie-ring-center {
      width: 148px;
      height: 148px;
      border-radius: 50%;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(61, 44, 34, 0.06);
    }

    @keyframes barGrow {
      from { width: 0%; }
    }
    .macro-bar-fill {
      animation: barGrow 0.8s ease-out forwards;
    }

    .dish-detail-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
    }
    .dish-detail-content.expanded {
      max-height: 500px;
    }
    .dish-expand-icon {
      transition: transform 0.3s ease;
    }
    .dish-expand-icon.rotated {
      transform: rotate(180deg);
    }

    .squiggle-decoration {
      opacity: 0.12;
    }

    .meal-card {
      border-left: 5px solid;
    }
  </style>

    ];

      '今天的蛋白质摄入不错！建议晚餐可以搭配一份蔬菜，补充维生素和膳食纤维。',

    function formatDate() {
      const now = new Date();
      const month = now.getMonth() + 1;
      const day = now.getDate();
      return `${month}月${day}日`;
    }

    function getDishItems() {
      // 始终以购物车实际数据为准，购物车为空时返回空数组（不再回退到示例数据）
      return cartData.items.map(item => ({
        ...item.dish,
        quantity: item.quantity,
        meal: assignMeal(item.dish),
        ordered: false
      }));
    }

    function getOrderedItems() {
      // 今日已下单的菜品（下单后保留，便于查看当日营养总和）
      return todayOrders.items.map(item => ({
        ...item.dish,
        quantity: item.quantity,
        meal: assignMeal(item.dish),
        ordered: true
      }));
    }

    function assignMeal(dish) {
      if (dish.category === 'snack' || dish.category === 'soup') return 'snacks';
      if (dish.category === 'staple') return 'lunch';
      return Math.random() > 0.5 ? 'lunch' : 'dinner';
    }

    function calculateNutrition(dishes) {
      const nutrition = { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0, sodium: 0 };
      dishes.forEach(dish => {
        const qty = dish.quantity || 1;
        nutrition.calories += dish.calories * qty;
        nutrition.protein += dish.protein * qty;
        nutrition.carbs += dish.carbs * qty;
        nutrition.fat += dish.fat * qty;
        nutrition.fiber += (dish.fiber || 0) * qty;
        nutrition.sodium += (dish.sodium || 0) * qty;
      });
      return nutrition;
    }

    function animateNumber(element, target, duration = 1000) {
      const start = 0;
      const startTime = performance.now();
      
      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const current = Math.floor(start + (target - start) * easeOut);
        element.textContent = current.toLocaleString();
        
        if (progress < 1) {
          requestAnimationFrame(update);
        }
      }
      
      requestAnimationFrame(update);
    }

    function updateCalorieRing(percentage) {
      const ring = document.getElementById('calorieRing');
      const degrees = Math.min(percentage / 100 * 360, 360);
      ring.style.background = `conic-gradient(#FF8C42 0deg ${degrees}deg, #F0E8E0 ${degrees}deg 360deg)`;
    }

    function updateMacroBar(barId, percentId, valueId, current, target, color) {
      const percentage = Math.min((current / target) * 100, 100);
      const bar = document.getElementById(barId);
      const percent = document.getElementById(percentId);
      const value = document.getElementById(valueId);
      
      setTimeout(() => {
        bar.style.width = percentage + '%';
      }, 200);
      
      percent.textContent = Math.round(percentage) + '%';
      value.textContent = Math.round(current);
    }

    function renderMealItems(containerId, dishes, mealType) {
      const container = document.getElementById(containerId);
      const mealDishes = dishes.filter(d => d.meal === mealType);
      
      if (mealDishes.length === 0) {
        container.innerHTML = '<div class="text-xs" style="color: var(--color-text-tertiary);">暂无菜品</div>';
        return;
      }
      
      container.innerHTML = mealDishes.map(dish => {
        const qty = dish.quantity || 1;
        const totalCal = dish.calories * qty;
        const name = qty > 1 ? `${dish.name} x${qty}` : dish.name;
        return `
          <div class="flex items-center justify-between">
            <span class="text-xs" style="color: var(--color-text-secondary);">${name}</span>
            <span class="text-xs" style="color: var(--color-text-tertiary);">${totalCal} kcal</span>
          </div>
        `;
      }).join('');
    }

    function getMealCalories(dishes, mealType) {
      return dishes
        .filter(d => d.meal === mealType)
        .reduce((sum, d) => sum + d.calories * (d.quantity || 1), 0);
    }

    function renderDishList(dishes) {
      const container = document.getElementById('dishList');
      const colors = ['#FF8C42', '#FF6B8A', '#6BC5A0', '#FFB74D', '#42A5F5'];
      
      container.innerHTML = dishes.map((dish, index) => {
        const color = colors[index % colors.length];
        const qty = dish.quantity || 1;
        const totalCal = dish.calories * qty;
        const name = qty > 1 ? `${dish.name} x${qty}` : dish.name;
        const expanded = index === 0 ? 'expanded' : '';
        const rotated = index === 0 ? 'rotated' : '';
        const orderTag = dish.ordered
          ? '<span style="font-size:10px;padding:2px 6px;background:#E8F5E9;color:#6BC5A0;border-radius:6px;margin-left:6px;font-weight:600;">已下单</span>'
          : '<span style="font-size:10px;padding:2px 6px;background:#FFF0E6;color:#FF8C42;border-radius:6px;margin-left:6px;font-weight:600;">待下单</span>';

        return `
          <div class="card overflow-hidden">
            <button onclick="toggleDish('dish-${dish.id}-${index}', this)" class="w-full flex items-center justify-between px-4 py-3 text-left">
              <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full" style="background: ${color};"></div>
                <span class="text-sm font-semibold" style="color: var(--color-text-primary);">${name}</span>
                ${orderTag}
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-medium" style="color: ${color};">${totalCal} kcal</span>
                <svg class="dish-expand-icon ${rotated}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A89588" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 9L12 15L18 9"/>
                </svg>
              </div>
            </button>
            <div id="dish-${dish.id}-${index}" class="dish-detail-content ${expanded}" style="border-top: 1px solid var(--color-border);">
              <div class="px-4 py-3 grid grid-cols-2 gap-x-4 gap-y-2.5">
                <div class="flex items-center justify-between">
                  <span class="text-xs" style="color: var(--color-text-secondary);">热量</span>
                  <span class="text-xs font-semibold" style="color: var(--color-text-primary);">${totalCal} kcal</span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-xs" style="color: var(--color-text-secondary);">蛋白质</span>
                  <span class="text-xs font-semibold" style="color: var(--color-primary);">${Math.round(dish.protein * qty)}g</span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-xs" style="color: var(--color-text-secondary);">碳水</span>
                  <span class="text-xs font-semibold" style="color: var(--color-secondary);">${Math.round(dish.carbs * qty)}g</span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-xs" style="color: var(--color-text-secondary);">脂肪</span>
                  <span class="text-xs font-semibold" style="color: var(--color-accent);">${Math.round(dish.fat * qty)}g</span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-xs" style="color: var(--color-text-secondary);">膳食纤维</span>
                  <span class="text-xs font-semibold" style="color: var(--color-text-primary);">${Math.round((dish.fiber || 0) * qty)}g</span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-xs" style="color: var(--color-text-secondary);">钠</span>
                  <span class="text-xs font-semibold" style="color: var(--color-text-primary);">${Math.round((dish.sodium || 0) * qty)}mg</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleDish(id, btn) {
      const content = document.getElementById(id);
      const icon = btn.querySelector('.dish-expand-icon');
      content.classList.toggle('expanded');
      icon.classList.toggle('rotated');
    }

    function updateHealthTip(nutrition) {
      const tipElement = document.getElementById('healthTip');
      let tipIndex = 0;
      
      if (nutrition.protein / TARGET_PROTEIN > 0.8) {
        tipIndex = 0;
      } else if (nutrition.carbs / TARGET_CARBS > 0.7) {
        tipIndex = 1;
      } else if (nutrition.fat / TARGET_FAT > 0.9) {
        tipIndex = 2;
      } else if (nutrition.calories / TARGET_CALORIES > 0.9) {
        tipIndex = 3;
      } else if (nutrition.fiber < 10) {
        tipIndex = 4;
      } else if (nutrition.sodium > 2000) {
        tipIndex = 5;
      } else {
        tipIndex = Math.floor(Math.random() * healthTips.length);
      }
      
      tipElement.textContent = healthTips[tipIndex];
    }

    function navigateTo(page) {
      window.location.href = page;
    }

    function renderEmptyState() {
      document.getElementById('caloriesValue').textContent = '0';
      updateCalorieRing(0);
      document.getElementById('targetCalories').textContent = TARGET_CALORIES.toLocaleString();
      document.getElementById('remainingCalories').textContent = TARGET_CALORIES.toLocaleString();

      ['proteinBar', 'carbsBar', 'fatBar'].forEach(id => document.getElementById(id).style.width = '0%');
      ['proteinPercent', 'carbsPercent', 'fatPercent'].forEach(id => document.getElementById(id).textContent = '0%');
      ['proteinValue', 'carbsValue', 'fatValue'].forEach(id => document.getElementById(id).textContent = '0');

      ['lunchItems', 'dinnerItems', 'snacksItems'].forEach(id => {
        document.getElementById(id).innerHTML = '<div class="text-xs" style="color: var(--color-text-tertiary);">暂无菜品</div>';
      });
      document.getElementById('lunchCalories').textContent = '0 kcal';
      document.getElementById('dinnerCalories').textContent = '0 kcal';
      document.getElementById('snacksCalories').textContent = '0 kcal';

      document.getElementById('dishList').innerHTML = '<div class="card p-5 text-center text-xs" style="color: var(--color-text-tertiary);">今天还没点菜，去首页添加几道菜看看营养吧～</div>';
      document.getElementById('healthTip').textContent = '今日还未点单，添加菜品后会自动计算营养摄入。';
    }

    function init() {
      document.getElementById('currentDate').textContent = formatDate();

      // 每次进入页面都重新从 localStorage 读取最新购物车和今日已下单数据
      cartData.load();
      todayOrders.load();

      // 合并购物车菜品 + 今日已下单菜品
      const cartDishes = getDishItems();
      const orderedDishes = getOrderedItems();
      const dishes = [...cartDishes, ...orderedDishes];

      if (dishes.length === 0) {
        renderEmptyState();
        return;
      }

      const nutrition = calculateNutrition(dishes);

      const caloriePercentage = (nutrition.calories / TARGET_CALORIES) * 100;
      animateNumber(document.getElementById('caloriesValue'), Math.round(nutrition.calories));
      setTimeout(() => updateCalorieRing(caloriePercentage), 100);

      document.getElementById('targetCalories').textContent = TARGET_CALORIES.toLocaleString();
      const remaining = Math.max(TARGET_CALORIES - Math.round(nutrition.calories), 0);
      document.getElementById('remainingCalories').textContent = remaining.toLocaleString();

      updateMacroBar('proteinBar', 'proteinPercent', 'proteinValue', nutrition.protein, TARGET_PROTEIN, 'primary');
      updateMacroBar('carbsBar', 'carbsPercent', 'carbsValue', nutrition.carbs, TARGET_CARBS, 'secondary');
      updateMacroBar('fatBar', 'fatPercent', 'fatValue', nutrition.fat, TARGET_FAT, 'accent');

      renderMealItems('lunchItems', dishes, 'lunch');
      renderMealItems('dinnerItems', dishes, 'dinner');
      renderMealItems('snacksItems', dishes, 'snacks');

      document.getElementById('lunchCalories').textContent = getMealCalories(dishes, 'lunch') + ' kcal';
      document.getElementById('dinnerCalories').textContent = getMealCalories(dishes, 'dinner') + ' kcal';
      document.getElementById('snacksCalories').textContent = getMealCalories(dishes, 'snacks') + ' kcal';

      renderDishList(dishes);

      updateHealthTip(nutrition);
    }

    // 使用 pageshow 而非 DOMContentLoaded，确保从 cart.html 返回时（含 bfcache 恢复）能刷新数据
    window.addEventListener('pageshow', init);
  </script>

</body>
</html>
